# 빌드 결과를 https://github.com/kkn1125/new-solitaire 의 gh-pages 브랜치로 푸시합니다.
# 사이트 URL: https://kkn1125.github.io/new-solitaire/
#
# 필요한 시크릿 (이 워크플로가 돌아가는 저장소 → Settings → Secrets and variables → Actions):
#   GH_PAGES_DEPLOY_TOKEN
#     - new-solitaire 에 push 할 수 있는 PAT (classic: repo) 또는 fine-grained: 해당 저장소 Contents write
#
# new-solitaire 저장소: Settings → Pages → Build from branch → gh-pages / root

name: Deploy to new-solitaire gh-pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-new-solitaire-gh-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # GitHub Pages 프로젝트 사이트 경로 (저장소 이름과 동일해야 함)
          VITE_BASE: /new-solitaire/
        run: npm run build

      - name: Deploy to kkn1125/new-solitaire gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.GH_PAGES_DEPLOY_TOKEN }}
          external_repository: kkn1125/new-solitaire
          publish_branch: gh-pages
          publish_dir: ./dist
          # force_orphan: true
